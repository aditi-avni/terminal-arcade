# Turns on GitHub's native auto-merge for pull requests that are safe to merge
# without a person looking at them.
#
# HOW IT WORKS
#   This does not merge anything itself. It flips the "auto-merge" switch on the
#   PR. GitHub then merges it only once every required check has gone green. If a
#   check fails, nothing happens — the contributor sees the red X and fixes it,
#   exactly as before. A branch ruleset on main enforces the checks, so a PR can
#   never slip in without them.
#
# WHAT IT DELIBERATELY WILL NOT AUTO-MERGE
#   Some PRs pass every test and should still be read by a human first. Passing
#   lint proves the code is tidy, not that it is honest.
#
#     1. Anything touching .github/** — a PR can edit the very workflow that is
#        judging it. Without this rule, someone rewrites lint.yml to always pass
#        and their own PR waves it through.
#     2. Anything touching dependency or packaging files, where a malicious
#        package is a one-line change.
#     3. PRs with no "Closes #123" — your own anti-spam rule.
#     4. Anything a maintainer has labelled needs-human-review or spam.
#
#   These are labelled and commented instead, so they queue for you rather than
#   getting lost.
#
# TO TURN THE GUARDRAILS OFF and auto-merge literally anything that is green,
# set AUTOMERGE_STRICT to "false" below. Read the list above first.
name: Auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AUTOMERGE_STRICT: "true"

jobs:
  enable:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Decide whether this PR can merge itself
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const strict = process.env.AUTOMERGE_STRICT !== 'false';
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const reasons = [];

            const labels = pr.labels.map(l => l.name.toLowerCase());
            if (labels.includes('needs-human-review')) {
              reasons.push('a maintainer marked this `needs-human-review`');
            }
            if (labels.includes('spam') || labels.includes('invalid')) {
              reasons.push('this PR is labelled `spam` or `invalid`');
            }

            if (strict) {
              // Does it link an issue? This is the Issue Pre-Assignment Rule.
              if (!/(close[sd]?|fixe?[sd]?|resolve[sd]?)\s+#\d+/i.test(pr.body || '')) {
                reasons.push(
                  'the description has no `Closes #123`, so we cannot tell which issue it finishes'
                );
              }

              // What does it touch?
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: pr.number, per_page: 100,
              });
              const sensitive = /^\.github\/|^(requirements.*\.txt|pyproject\.toml|package(-lock)?\.json|yarn\.lock|Gemfile|go\.mod|Cargo\.toml)$/;
              const touched = files.map(f => f.filename).filter(f => sensitive.test(f));
              if (touched.length) {
                reasons.push(
                  'it changes files that decide how this repo is built or checked ' +
                  '(`' + touched.slice(0, 5).join('`, `') + '`)'
                );
              }
            }

            core.setOutput('ok', reasons.length === 0 ? 'true' : 'false');
            core.setOutput('reasons', JSON.stringify(reasons));

      - name: Hold it for a human
        if: steps.gate.outputs.ok != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const reasons = JSON.parse('${{ steps.gate.outputs.reasons }}');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            try {
              await github.rest.issues.addLabels({
                owner, repo, issue_number, labels: ['needs-human-review'],
              });
            } catch (e) { /* label may not exist yet */ }

            const marker = '<!-- automerge-hold -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            if (comments.some(c => c.body.includes(marker))) return;

            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body:
                marker + '\n' +
                "Thanks for this. Your checks will still run as normal, but this PR " +
                "will **not** merge itself — a maintainer needs to read it first:\n\n" +
                reasons.map(r => `- ${r}`).join('\n') +
                "\n\nThis is not a rejection and it is not about the quality of your " +
                "code. Some changes just need human eyes. A maintainer will get to it " +
                "within 48 hours.\n\n" +
                (reasons.some(r => r.includes('Closes')) ?
                  "If you meant to link an issue, edit your description to include " +
                  "`Closes #123` and this comment sorts itself out.\n" : ''),
            });

      - name: Enable auto-merge
        if: steps.gate.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --squash --auto \
          && echo "Auto-merge enabled. GitHub will merge this once every check is green." \
          || echo "::warning::Could not enable auto-merge. Usually means it is already on, or the PR has a conflict."

      - name: Say so on the PR
        if: steps.gate.outputs.ok == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const marker = '<!-- automerge-on -->';

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            if (comments.some(c => c.body.includes(marker))) return;

            try {
              await github.rest.issues.addLabels({
                owner, repo, issue_number, labels: ['hacktoberfest-accepted'],
              });
            } catch (e) { /* label may not exist yet */ }

            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body:
                marker + '\n' +
                "**Auto-merge is on.** As soon as every check below turns green, this " +
                "merges by itself. You do not need to do anything else.\n\n" +
                "If a check goes red, click **Details** next to it — the log names the " +
                "file and the line. Push a fix to this same branch and it re-runs " +
                "automatically. That is the normal way this goes, not a failure.",
            });
