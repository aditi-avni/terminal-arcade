[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-arcade"
version = "0.1.0"
description = "A collection of small games you play in your terminal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GITHUB Community GITAM" }]
keywords = ["games", "terminal", "cli", "hacktoberfest", "beginner-friendly"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]

# No runtime dependencies, on purpose. Everything here is Python's standard
# library, so `pip install` can never be the reason you cannot play.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
arcade = "arcade.main:main"

[project.urls]
Homepage = "https://github.com/pushpam2404/terminal-arcade"
Issues = "https://github.com/pushpam2404/terminal-arcade/issues"

[tool.setuptools.packages.find]
include = ["arcade*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
